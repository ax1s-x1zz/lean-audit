[package]
name = "lean-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only auditor for Lean 4 research repositories: re-computes the verification claims a repository publishes about itself."
license = "Apache-2.0"
repository = "https://github.com/ax1s-x1zz/lean-audit"
readme = "README.md"
keywords = ["lean4", "formal-verification", "audit", "reproducibility", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "lean-audit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
