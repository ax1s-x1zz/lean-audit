name: release

# Build the binary on a tag and attach it to the GitHub release, so the tool can
# be used without a Rust toolchain. Uses first-party actions only (checkout,
# cache, upload-artifact, download-artifact) plus the preinstalled `gh` CLI for
# the release itself — no third-party release action.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset="lean-audit-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/lean-audit" "$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "--- $asset.sha256 ---"
          cat "$asset.sha256"
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          ./${{ steps.package.outputs.asset }} --version
          ./${{ steps.package.outputs.asset }} --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    # Only a tag creates a release; `workflow_dispatch` is for building the
    # artifacts by hand, and `GITHUB_REF_NAME` there is a branch name.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -l dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            dist/*
